[project]
name = "reeve"
version = "0.2.2"
description = "A lightweight macro assistant for Age of Empires IV: live alerts and match reports from the game UI."
authors = [
    { name = "Matias Herklotz" }
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "mss>=10.2",
    "numpy>=2.1",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
]

[project.scripts]
reeve = "reeve.cli:main"

[project.gui-scripts]
reeve-app = "reeve.launcher:main"

[dependency-groups]
dev = ["pytest>=8.3", "pyinstaller>=6.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
