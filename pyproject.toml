[project]
name = "aoe4ov"
version = "0.1.0"
description = "Lightweight Age of Empires IV overlay: reads the game UI through template matching and provides macro tips."
authors = [
    { name = "Matias Herklotz", email = "delend89@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mss>=10.2",
    "numpy>=2.1",
    "pillow>=13.0.0",
]

[project.scripts]
aoe4ov = "aoe4ov.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
