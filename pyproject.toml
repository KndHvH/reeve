[project]
name = "reeve"
version = "0.2.0"
description = "Lightweight Age of Empires IV overlay: reads the game UI through template matching and provides macro tips."
authors = [
    { name = "Matias Herklotz", email = "delend89@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mss>=10.2",
    "numpy>=2.1",
    "pillow>=13.0.0",
    "pystray>=0.19.5",
    "pywebview>=6.2.1",
]

[project.scripts]
reeve = "reeve.cli:main"

[project.gui-scripts]
reeve-app = "reeve.launcher:main"

[dependency-groups]
dev = ["pytest>=8.3", "pyinstaller>=6.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
