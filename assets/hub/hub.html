<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reeve</title>
<style>
:root {
  color-scheme: dark;
  --night: #0e1319; --panel: #151c25; --panel-2: #1a2330; --rule: #263140;
  --accent: #c9a45c; --accent-dim: #6b5734; --accent-light: #ead39a;
  --ink: #ece4d0; --ink-2: #c4bfb2; --mist: #98a0a8;
  --info: #7fb2c9; --warn: #f0b429; --critical: #e5484d;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
  --sans: "Segoe UI", system-ui, sans-serif;
  --radius: 3px; --radius-sm: 2px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--night); color: var(--ink); font: 14px/1.5 var(--sans); display: grid;
  grid-template-columns: 200px minmax(0, 1fr); height: 100vh; overflow: hidden; }
nav { border-right: 1px solid var(--accent-dim); padding: 22px 0; display: flex; flex-direction: column; height: 100vh; }
.scroll { overflow-y: auto; height: 100vh; }
nav h1 { font: 600 20px/1.1 var(--serif); color: var(--accent-light); margin: 0 20px 22px; }
nav button { all: unset; cursor: pointer; padding: 9px 20px; color: var(--ink-2); font: 16px var(--serif); border-left: 3px solid transparent; }
nav button:hover { color: var(--ink); }
nav button[aria-current="page"] { color: var(--accent-light); border-left-color: var(--accent); background: var(--panel); }
nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
nav .foot { margin-top: auto; padding: 0 20px; color: var(--mist); font-size: 12px; }
nav .foot a { color: var(--mist); cursor: pointer; text-decoration: underline; }
main { padding: 26px 30px 60px; max-width: 980px; }
main.report { max-width: none; padding: 0; height: 100vh; display: flex; flex-direction: column; }

/* Report view: the match's report.html in a frame, under a slim bar */
.bar { display: flex; align-items: center; gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--accent-dim); }
.bar button { all: unset; cursor: pointer; color: var(--accent-light); font: 15px var(--serif); padding: 3px 8px; border-radius: var(--radius); }
.bar button:hover { background: var(--panel); }
.bar button:focus-visible { outline: 2px solid var(--accent); }
.bar .title { color: var(--ink-2); }
.bar .ext { margin-left: auto; color: var(--mist); font: 13px var(--sans); }
main.report iframe { flex: 1; width: 100%; border: 0; background: var(--night); }
h2 { font: 600 24px/1.2 var(--serif); color: var(--accent-light); margin: 0 0 4px; }
.lede { color: var(--mist); margin: 0 0 20px; }
h3 { font: 600 17px/1.2 var(--serif); color: var(--accent); margin: 0 0 12px; }

/* Matches */
.match { all: unset; box-sizing: border-box; width: 100%; display: grid; grid-template-columns: 170px 90px 1fr auto; gap: 16px;
  align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--rule); cursor: pointer; }
.match:hover, .match:focus-visible { background: var(--panel); outline: none; }
.match .when b { display: block; font-family: var(--serif); font-size: 16px; }
.flag { height: 14px; vertical-align: -1px; margin-right: 7px; border-radius: 2px; box-shadow: 0 0 0 1px var(--accent-dim); }
.match .when span, .match .dur span { color: var(--mist); font-size: 12px; }
.match .dur span { margin-left: 5px; }
.match .dur b { font: 600 18px var(--serif); font-variant-numeric: tabular-nums; }
.ages { display: flex; gap: 14px; flex-wrap: wrap; }
.ages span { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
.ages i { font: normal 600 15px var(--serif); color: var(--accent); margin-right: 4px; }
.probs { display: grid; grid-template-columns: repeat(var(--n, 4), 106px); gap: 6px; justify-content: end; }
@media (max-width: 1320px) { .probs.wide { grid-template-columns: repeat(2, 106px); } }
/* One column per alert, always in the same order; the dot carries the worst severity. */
.prob { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: var(--radius-sm);
  background: var(--panel-2); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.prob i { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--mist); }
.prob.warn i { background: var(--warn); } .prob.critical i { background: var(--critical); } .prob.info i { background: var(--info); }
.prob b { margin-left: auto; font-weight: normal; color: var(--ink); }
.prob.none { visibility: hidden; }
.empty { color: var(--mist); padding: 30px 0; }
.more { display: block; margin: 18px auto; background: var(--panel-2); color: var(--ink); border: 1px solid var(--accent-dim);
  border-radius: var(--radius); padding: 7px 18px; cursor: pointer; font: 13px var(--sans); }
.more:hover, .more:focus-visible { border-color: var(--accent); outline: none; }

/* Settings */
.group { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px 18px; margin-bottom: 14px; }
.group header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.group header h3 { margin: 0; }
.row { display: grid; grid-template-columns: 1fr 180px; align-items: center; gap: 12px; padding: 7px 0; border-top: 1px solid var(--rule); }
.row label { color: var(--ink-2); }
.row small { display: block; color: var(--mist); font-size: 12px; }
input[type=number], select { background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius); padding: 5px 8px; font: 14px var(--sans); width: 100%; }
input[type=number]:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.switch { appearance: none; width: 38px; height: 20px; border-radius: 10px; background: var(--rule); position: relative; cursor: pointer; margin: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--mist); transition: left .15s; }
.switch:checked { background: var(--accent-dim); } .switch:checked::after { left: 21px; background: var(--accent-light); }
.switch:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch.big { width: 52px; height: 28px; border-radius: 14px; }
.switch.big::after { top: 4px; left: 4px; width: 20px; height: 20px; } .switch.big:checked::after { left: 28px; }
.switch.big { flex: none; margin-top: 6px; }
.off { opacity: .45; filter: grayscale(1); transition: opacity .15s; }
.row > .switch, .row > .seg { justify-self: end; }
.pair { display: flex; gap: 6px; align-items: center; }
.pair button, .actions button { background: var(--panel-2); color: var(--ink); border: 1px solid var(--accent-dim); border-radius: var(--radius); padding: 5px 10px; cursor: pointer; font: 13px var(--sans); }
.pair button:hover, .actions button:hover { border-color: var(--accent); }
.row.wide { grid-template-columns: 1fr 330px; }
.row.limits { grid-template-columns: 1fr 440px; }
.bands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.age-limit { display: flex; align-items: center; gap: 4px; }
.age-limit i { font: normal 600 13px var(--serif); color: var(--accent); min-width: 20px; text-align: right; }
.actions { display: flex; gap: 10px; align-items: center; position: sticky; bottom: 0; background: var(--night); padding: 12px 0; border-top: 1px solid var(--accent-dim); }
.actions .primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }
.status { color: var(--mist); font-size: 13px; }
.usage { color: var(--mist); font-size: 13px; margin: 8px 0 0; }
#vol { min-width: 38px; text-align: right; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.mine { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
#mine { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 2px; background: var(--panel-2); border: 1px solid var(--rule);
  border-radius: var(--radius); padding: 2px 4px 2px 9px; font-size: 13px; }
.chip button { all: unset; cursor: pointer; color: var(--mist); padding: 0 5px; font-size: 12px; }
.chip button:hover { color: var(--accent-light); }
.chip button:focus-visible { outline: 2px solid var(--accent); }
.mine .none { color: var(--mist); font-size: 13px; }
#add-sound { background: var(--panel-2); color: var(--ink); border: 1px solid var(--accent-dim); border-radius: var(--radius);
  padding: 5px 10px; cursor: pointer; font: 13px var(--sans); }
#add-sound:hover { border-color: var(--accent); }

/* Appearance */
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 4px 0 10px; }
.theme { all: unset; box-sizing: border-box; cursor: pointer; border: 2px solid; border-radius: var(--radius);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
.theme .sw { display: flex; gap: 3px; margin-bottom: 6px; }
.theme .sw i { flex: 1; height: 14px; border-radius: var(--radius-sm); }
.theme b { font: 600 15px var(--serif); }
.theme small { font-size: 12px; }
.theme:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.preview { position: relative; overflow: hidden; height: 132px; margin: 2px 0 10px; padding: 14px 0 0 16px;
  border: 1px solid var(--rule); border-radius: var(--radius);
  background: linear-gradient(135deg, #4f5d3f, #6b6a45 55%, #56634a); display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.preview::after { content: attr(data-label); position: absolute; right: 10px; bottom: 6px; font: 12px var(--sans); color: #f1ead8; opacity: .7; }
.pcard { display: inline-flex; align-items: center; gap: 9px; padding: 7px 13px 7px 11px; border-left: 4px solid var(--sev);
  background: var(--card, var(--panel)); color: var(--card-ink, var(--ink)); font: 700 17px/1.2 var(--serif); }
.pcard img { height: 26px; }
.preview.plate .pcard img { width: 31px; object-fit: contain; padding: 5px; margin: -5px 0; background: var(--card-icon, transparent); border-radius: 3px; }
.preview.rounded .pcard { border-radius: 8px; }
.seg { display: inline-flex; border: 1px solid var(--accent-dim); border-radius: var(--radius); overflow: hidden; justify-self: start; }
.seg button { all: unset; cursor: pointer; padding: 5px 14px; color: var(--ink-2); font: 13px var(--sans); }
.seg button[aria-checked="true"] { background: var(--accent-dim); color: var(--accent-light); }
.seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
<style>
/* Update banner */
.banner-wrap { position: sticky; top: 0; z-index: 5; background: var(--night); padding: 16px 30px 6px; }
.banner-wrap[hidden] { display: none; }
.banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 14px;
  background: var(--panel-2); border: 1px solid var(--rule); border-left: 3px solid var(--accent); border-radius: var(--radius); }
.banner b { color: var(--accent-light); font-family: var(--serif); font-size: 15px; }
.banner span { color: var(--ink-2); }
.banner .grow { flex: 1; }
.banner button, .upd button { background: var(--panel); color: var(--ink); border: 1px solid var(--accent-dim); border-radius: var(--radius);
  padding: 5px 12px; cursor: pointer; font: 13px var(--sans); }
.banner button.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }
.banner button:hover, .upd button:hover { border-color: var(--accent); }
.upd { display: flex; gap: 10px; align-items: center; justify-self: end; }
.row.version { grid-template-columns: 1fr auto; } .upd button { white-space: nowrap; }
.upd button.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }
/* Builds */
.import { display: flex; gap: 8px; margin: 4px 0 6px; }
.import input { flex: 1; background: var(--panel-2); color: var(--ink); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 7px 10px; font: 14px var(--sans); }
.import input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.import button, .bo button { background: var(--panel-2); color: var(--ink); border: 1px solid var(--accent-dim); border-radius: var(--radius);
  padding: 6px 12px; cursor: pointer; font: 13px var(--sans); white-space: nowrap; }
.import button.primary { background: var(--accent-dim); border-color: var(--accent); color: var(--accent-light); font-weight: 600; }
.import button:hover, .bo button:hover { border-color: var(--accent); }
.import button:disabled { opacity: .5; cursor: default; }
.bo { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid var(--rule); }
.bo b { font: 600 16px var(--serif); color: var(--ink); }
.bo small { display: block; color: var(--mist); font-size: 12px; }
.bo .acts { display: flex; gap: 6px; align-items: center; }
.bo .using { color: var(--accent-light); font-size: 13px; padding: 0 8px; }
.bo.active b { color: var(--accent-light); }
/* Build panel preview: the same blocks as in game (build_panel.py) */
.bpreview { position: relative; display: flex; justify-content: flex-end; padding: 14px 16px 26px; margin: 2px 0 10px; min-height: 60px;
  border: 1px solid var(--rule); border-radius: var(--radius); background: linear-gradient(135deg, #4f5d3f, #6b6a45 55%, #56634a); }
.bpreview::after { content: attr(data-label); position: absolute; left: 12px; bottom: 6px; font: 12px var(--sans); color: #f1ead8; opacity: .7; }
.bpreview > .pcard { align-self: flex-start; margin-right: auto; }
.bpreview.rounded > .pcard { border-radius: 8px; }
.bpreview .hint { align-self: center; margin-right: auto; color: #f1ead8; font-size: 13px; }
.bpanel { width: 300px; display: flex; flex-direction: column; gap: 5px; zoom: calc(1.33 * var(--bscale, 1)); font: 12px/1.35 var(--sans); }
.bstep { background: var(--card, var(--panel)); color: var(--mist); padding: 6px 8px 6px 11px; border-left: 3px solid transparent; }
.bpreview.rounded .bstep { border-radius: 8px; }
.bstep.cur { color: var(--card-ink, var(--ink)); border-left-color: var(--accent); }
.bstep:not(.cur) img { opacity: .5; }
.bstep .hd { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
.bstep .hd i { font: normal 600 13px var(--serif); color: var(--mist); min-width: 18px; }
.bstep.cur .hd i { color: var(--accent); }
.bstep .hd .t { color: var(--mist); font-size: 11px; }
.bstep .slots { margin-left: auto; display: grid; grid-template-columns: repeat(5, 34px); }
.bstep .slots span { display: flex; align-items: center; gap: 2px; font-weight: 600; font-variant-numeric: tabular-nums; }
.bstep .slots span.zero { color: var(--mist); font-weight: normal; }
.btip { background: var(--card, var(--panel)); color: var(--card-ink, var(--ink)); padding: 6px 8px 6px 11px; border-left: 3px solid var(--info); }
.bpreview.rounded .btip { border-radius: 8px; }
.bstep .slots img { height: 11px; width: 13px; object-fit: contain; }
.bstep .note img, .btip .note img { height: 15px; vertical-align: -3px; margin: 0 1px; }
/* As in game: the arrows centered over the steps, the rally card at the right end. */
.btop { display: grid; grid-template-columns: 1fr auto 1fr; gap: 5px; }
.btop .barrows { grid-column: 2; } .btop .brally { grid-column: 3; justify-self: end; }
.barrows { display: flex; align-items: center; gap: 10px; padding: 0 8px; background: var(--card, var(--panel)); color: var(--mist); font-size: 11px; }
.bpreview.rounded .barrows { border-radius: 8px; }
.barrows b { color: var(--accent); font-size: 17px; }
.brally { display: flex; align-items: center; gap: 4px; padding: 5px 6px; background: var(--card, var(--panel)); }
.bpreview.rounded .brally { border-radius: 8px; }
.brally img { height: 22px; } .brally b { color: var(--accent); font-size: 16px; } .brally span { color: var(--card-ink, var(--ink)); }
/* Matches: select and delete */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.tools { display: flex; gap: 8px; align-items: center; color: var(--mist); font-size: 13px; padding-top: 4px; }
.tools button { background: var(--panel-2); color: var(--ink); border: 1px solid var(--accent-dim); border-radius: var(--radius);
  padding: 5px 12px; cursor: pointer; font: 13px var(--sans); }
.tools button:hover { border-color: var(--accent); }
.tools button:disabled { opacity: .45; cursor: default; }
button.danger { border-color: var(--critical) !important; color: var(--critical) !important; }
.bar .danger { margin-left: 8px; background: none; border: 1px solid; border-radius: var(--radius); padding: 3px 10px; font: 13px var(--sans); }
.match.sel { grid-template-columns: 26px 170px 90px 1fr auto; }
.match .tick { position: relative; width: 18px; height: 18px; box-sizing: border-box;
  border: 1px solid var(--accent-dim); border-radius: var(--radius-sm); }
.match[aria-pressed="true"] { background: var(--panel); }
.match[aria-pressed="true"] .tick { background: var(--accent-dim); border-color: var(--accent); }
/* The check is drawn, not a text glyph: a font's line height would push it off center. */
.match[aria-pressed="true"] .tick::after { content: ""; position: absolute; left: 50%; top: 45%; width: 4px; height: 8px;
  border: solid var(--accent-light); border-width: 0 2px 2px 0; transform: translate(-50%, -50%) rotate(45deg); }
</style>
<style id="look"></style>
</head>
<body>
<nav>
  <h1>Reeve</h1>
  <button id="nav-matches" aria-current="page"></button>
  <button id="nav-builds"></button>
  <button id="nav-settings"></button>
  <div class="foot"><span id="ver"></span><br><a id="data-folder"></a></div>
</nav>
<div class="scroll"><div class="banner-wrap" id="update-wrap" hidden><div class="banner" id="update-banner" role="status"></div></div><main id="main"></main></div>
<script>
const api = () => window.pywebview.api;
// Interface language (i18n.py): the page's texts are written in English and
// looked up in the translation; N_ marks a text translated where it is shown.
let T = {};
const tr = (s, v = {}) => (T[s] ?? s).replace(/\{(\w+)\}/g, (m, k) => k in v ? v[k] : m);
const trn = (one, many, n, v = {}) => tr(n === 1 ? one : many, { n, ...v });
const N_ = s => s;
let lang = { setting: "auto", lang: "en", languages: {} };
const $ = s => document.querySelector(s);
const fmt = s => s == null ? "–" : `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const ROMAN = { 2: "II", 3: "III", 4: "IV" };
const PROB = { tc_idle: N_("TC idle"), idle_villager: N_("Idle"), housed: N_("Housed"), floating: N_("Floating"), build: N_("Build") };   // column order
let current = "matches";
let selecting = false;          // Matches: select mode for deleting
const picked = new Set();
// Matches: how far back the list goes; "Load more" takes the next step (null: all).
const SPANS = [3, 7, 30, null];
let span = 0;

let version = "";

function useLanguage(l) {
  lang = l;
  T = l.strings || {};
  document.documentElement.lang = l.lang;
}

// The texts outside the page area: navigation and footer.
function applyStatic() {
  $("nav").setAttribute("aria-label", tr("Sections"));
  $("#nav-matches").textContent = tr("Matches");
  $("#nav-builds").textContent = tr("Builds");
  $("#nav-settings").textContent = tr("Settings");
  $("#data-folder").textContent = tr("Open data folder");
  $("#ver").textContent = tr("version {version}", { version });
}

// Language: saved and applied at once; the hub redraws itself in it.
function languageSection() {
  const opts = [["auto", tr("Automatic (Windows language)")], ...Object.entries(lang.languages)]
    .map(([v, l]) => `<option value="${v}" ${lang.setting === v ? "selected" : ""}>${esc(l)}</option>`).join("");
  return `<section class="group"><header><h3>${tr("Language")}</h3></header>
    <div class="row wide"><label>${tr("Interface language")}<small>${tr("the hub, reports, alerts, the build panel, the tray and notifications")}</small></label>
      <select id="language" aria-label="${tr("Interface language")}">${opts}</select></div></section>`;
}

function bindLanguage() {
  $("#language").addEventListener("change", async e => {
    useLanguage(await api().set_language(e.target.value));
    applyStatic();
    if (updateInfo) showBanner(updateInfo);
    await showSettings();
    $("#language").focus();
  });
}

function navTo(page) {
  current = page;
  $("#main").className = "";
  for (const [id, name] of [["#nav-matches", "matches"], ["#nav-builds", "builds"], ["#nav-settings", "settings"]]) {
    if (name === page) $(id).setAttribute("aria-current", "page"); else $(id).removeAttribute("aria-current");
  }
  document.querySelector(".scroll").scrollTop = 0;
  page === "matches" ? showMatches() : page === "builds" ? showBuilds() : showSettings();
}

// A civilization's flag (assets/flags); matches have one when they followed a build.
const flagImg = (abbr, civ) => abbr ? `<img class="flag" src="../flags/${abbr}.png" alt="${esc(civ || "")}" title="${esc(civ || "")}">` : "";

async function showMatches() {
  const { matches: list, older } = await api().matches(SPANS[span]);
  // Only the time each alert spent critical; the report has the rest. A
  // column only for the alerts some listed match had critical.
  const crit = (m, id) => (m.problems || {})[id]?.critical || 0;
  const cols = Object.keys(PROB).filter(id => list.some(m => crit(m, id) > 0));
  const rows = list.map(m => {
    const ages = (m.ages || []).map(a => `<span><i>${ROMAN[a.age] || a.age}</i>${fmt(a.reached)}</span>`).join("");
    const had = cols.filter(id => crit(m, id) > 0);
    const probs = had.length && cols.map(id => crit(m, id) > 0
      ? `<span class="prob critical" title="${tr("{alert}: {critical} critical ({any} with any alert)", { alert: tr(PROB[id]), critical: fmt(crit(m, id)), any: fmt(m.problems[id].seconds) })}"><i></i>${tr(PROB[id])}<b>${fmt(crit(m, id))}</b></span>`
      : `<span class="prob none" aria-hidden="true"></span>`).join("");
    const vil = m.villagers_at || {};
    const on = picked.has(m.session);
    return `<button class="match${selecting ? " sel" : ""}" data-session="${m.session}" data-started="${m.started}"
      ${selecting ? `aria-pressed="${on}" title="${tr("Select")}"` : `title="${tr("Open the report")}"`}>
      ${selecting ? `<span class="tick" aria-hidden="true"></span>` : ""}
      <div class="when"><b>${flagImg(m.flag, m.civ)}${m.started}</b><span>${vil["10"] != null ? tr("{n} villagers at 10 min", { n: vil["10"] }) : ""}</span></div>
      <div class="dur"><b>${fmt(m.duration)}</b><span>${tr("played")}</span></div>
      <div class="ages">${ages || '<span><i>I</i></span>'}</div>
      <div class="probs${cols.length > 2 ? " wide" : ""}" style="--n:${Math.max(cols.length, 1)}">${probs || ""}</div></button>`;
  }).join("");
  const tools = !list.length ? "" : selecting
    ? `<div class="tools"><span>${tr("{n} selected", { n: picked.size })}</span>
        <button type="button" id="sel-all">${picked.size === list.length ? tr("Select none") : tr("Select all")}</button>
        <button type="button" class="danger" id="sel-delete" ${picked.size ? "" : "disabled"}>${picked.size ? trn("Delete {n} match", "Delete {n} matches", picked.size) : tr("Delete")}</button>
        <button type="button" id="sel-cancel">${tr("Done")}</button></div>`
    : `<div class="tools"><button type="button" id="sel-start">${tr("Select")}</button></div>`;
  $("#main").innerHTML = `<div class="head"><div><h2>${tr("Matches")}</h2><p class="lede">${tr("Every match the overlay recorded, newest first, with the time each alert was critical. Open one to see its report.")}</p></div>${tools}</div>
    ${rows || (older ? "" : `<p class="empty">${tr("No matches yet. Play a match with the overlay on and it will show up here.")}</p>`)}
    ${older ? `<button type="button" class="more" id="load-more">${tr("Load more")}</button>` : ""}`;
  if (older) $("#load-more").addEventListener("click", () => { span++; showMatches(); });
  document.querySelectorAll(".match").forEach(b => b.addEventListener("click", () => {
    if (!selecting) return showReport(b.dataset.session, b.dataset.started);
    picked.has(b.dataset.session) ? picked.delete(b.dataset.session) : picked.add(b.dataset.session);
    showMatches();
  }));
  if (!list.length) return;
  if (!selecting) { $("#sel-start").addEventListener("click", () => { selecting = true; showMatches(); }); return; }
  $("#sel-cancel").addEventListener("click", () => { selecting = false; picked.clear(); showMatches(); });
  $("#sel-all").addEventListener("click", () => {
    picked.size === list.length ? picked.clear() : list.forEach(m => picked.add(m.session));
    showMatches();
  });
  confirmDelete($("#sel-delete"), () => [...picked], async () => { picked.clear(); selecting = false; showMatches(); });
}

// Deleting asks once more on the button itself: the first click arms it.
function confirmDelete(button, sessions, after) {
  let armed = false;
  button.addEventListener("click", async () => {
    const list = sessions();
    if (!list.length) return;
    if (!armed) {
      armed = true;
      button.textContent = trn("Delete {n} match? Click to confirm", "Delete {n} matches? Click to confirm", list.length);
      setTimeout(() => { if (armed) { armed = false; button.textContent = trn("Delete {n} match", "Delete {n} matches", list.length); } }, 4000);
      return;
    }
    armed = false;
    await api().delete_matches(list);
    after();
  });
}

async function showReport(session, started) {
  const main = $("#main");
  main.className = "report";
  main.innerHTML = `<div class="bar"><button id="back">← ${tr("Matches")}</button><span class="title">${tr("Match of {date}", { date: started })}</span>

}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const BSLOTS = ["food", "wood", "gold", "stone", "builder"];
const ROMAN_ALL = { 1: "I", 2: "II", 3: "III", 4: "IV" };
const clock = t => t == null ? "" : `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`;

// The build panel as in game (build_panel.py): age, planned time, villagers and
// their places, then the notes with aoe4guides' icons.
function buildPanelHtml(p) {
  if (!p) return `<span class="hint">${tr("Import a build in Builds to see its steps here.")}</span>`;
  const alert = `<div class="pcard" style="--sev: var(--warn)"><img src="../report_icons/food.png" alt=""><span>${trn("Move {n} villager from {src} to {dst}", "Move {n} villagers from {src} to {dst}", 2, { src: tr("wood"), dst: tr("food") })}</span></div>`;
  const r = p.rally;
  const rally = r ? `<div class="brally"><img src="../report_icons/rally.png" alt="${tr("Rally point")}"><b>›</b>${r.icon
    ? `<img src="${p.icons[r.icon]}" alt="">` : `<span>${esc(r.text)}</span>`}</div>` : "";
  const cur = p.steps.findIndex(s => s.current);
  const arrows = (cfg.build_order || {}).arrows !== false
    ? `<div class="barrows"><b>‹</b>${(p.index ?? cur) + 1} / ${p.count ?? p.steps.length}<b>›</b></div>` : "";
  const top = rally || arrows ? `<div class="btop">${arrows}${rally}</div>` : "";
  const bo = cfg.build_order || {};
  const lines = ls => ls.map(line => `<div class="note">${line.map(x => x.icon ? `<img src="${p.icons[x.icon]}" alt="">` : esc(x.text)).join("")}</div>`).join("");
  return alert + `<div class="bpanel">${top}${p.steps.map(s => {
    const slots = BSLOTS.map(n => s.targets[n] || bo.empty_places
      ? `<span class="${s.targets[n] ? "" : "zero"}"><img src="../report_icons/${n}.png" alt="${tr(n)}">${s.targets[n] || "–"}</span>` : "<span></span>").join("");
    const tips = bo.tips !== false && (s.tips || []).length ? `<div class="btip">${lines(s.tips)}</div>` : "";
    return `<div class="bstep${s.current ? " cur" : ""}"><div class="hd"><i>${ROMAN_ALL[s.age] || ""}</i><span class="t">${clock(s.time)}</span><span class="slots">${slots}</span></div>${lines(s.notes)}</div>${tips}`;
  }).join("")}</div>`;
}

// Alert card animations: one effect per moment (cards.py), applied at once.
const ANIM_DEFAULT = { enter: "slide", exit: "long_fade", move: "slide" };
const ANIM_EFFECTS = [["none", N_("None")], ["short_fade", N_("Short fade")], ["long_fade", N_("Long fade")], ["slide", N_("Slide")]];
const ANIM_MOMENTS = [
  ["enter", N_("Alert appears"), N_("slide comes in from the left edge of the screen")],
  ["exit", N_("Alert clears"), N_("slide goes out to the left edge")],
  ["move", N_("Alerts rearrange"), N_("when one clears, the others move to their new place")],
];

const PREVIEW = () => [["critical", "villager", tr("Town center idle: queue a villager")],
                       ["info", "gold", tr("Floating {resources}", { resources: `${tr("gold")} 900` })]];
const previewCards = () => PREVIEW().map(([sev, icon, text]) =>
  `<div class="pcard" style="--sev: var(--${sev})"><img src="../report_icons/${icon}.png" alt=""><span>${text}</span></div>`).join("");
const ANIM_MS = { short_fade: 150, long_fade: 450, slide: 250 };
const EASE_OUT = "cubic-bezier(.33, 1, .68, 1)";       // cubic ease out, as in game
const pause = ms => new Promise(r => setTimeout(r, ms));

// One card in or out with an effect; slides go to and from the left edge.
function animateCard(el, effect, leaving) {
  if (!ANIM_MS[effect]) return Promise.resolve();
  const away = effect === "slide" ? { transform: `translateX(${-(el.offsetLeft + el.offsetWidth)}px)` } : { opacity: 0 };
  const here = effect === "slide" ? { transform: "none" } : { opacity: 1 };
  return el.animate(leaving ? [here, away] : [away, here], { duration: ANIM_MS[effect], easing: EASE_OUT, fill: "forwards" }).finished;
}

// Plays one moment on the preview: an alert appears, clears, or clears and
// the one below moves into its place (as the cards do in game).
async function playPreview(moment) {
  const box = $("#preview");
  if (!box || box.dataset.busy) return;
  box.dataset.busy = "1";
  const anim = { ...ANIM_DEFAULT, ...((cfg.overlay || {}).animation || {}) };
  box.innerHTML = previewCards();
  const [first, second] = box.children;
  try {
    if (moment === "enter") {
      await animateCard(first, anim.enter, false);
    } else if (moment === "exit") {
      await animateCard(first, anim.exit, true);
      await pause(500);
    } else {
      const before = second.getBoundingClientRect().top;
      Object.assign(first.style, { position: "absolute", top: `${first.offsetTop}px`, left: `${first.offsetLeft}px` });
      const dy = before - second.getBoundingClientRect().top;
      const leave = animateCard(first, anim.exit, true);
      if (anim.move === "slide") {
        await second.animate([{ transform: `translateY(${dy}px)` }, { transform: "none" }], { duration: ANIM_MS.slide, easing: EASE_OUT }).finished;
      } else if (ANIM_MS[anim.move]) {
        const half = ANIM_MS[anim.move] / 2;
        await second.animate([{ transform: `translateY(${dy}px)`, opacity: 1 }, { transform: `translateY(${dy}px)`, opacity: 0 }], half).finished;
        await second.animate([{ opacity: 0 }, { opacity: 1 }], half).finished;
      }
      await leave;
      await pause(700);
    }
  } finally {
    await pause(250);
    box.innerHTML = previewCards();
    delete box.dataset.busy;
  }
}

  const rec = (cfg.overlay || {}).show_in_recordings !== false;

    ${motion}
    <div class="row"><label>${tr("Show alerts in recordings and streams")}<small>${tr("clips, screen recordings and streaming apps capture the alert cards")}</small></label>
      <input type="checkbox" class="switch" id="show-rec" ${rec ? "checked" : ""} aria-label="${tr("Show alerts in recordings and streams")}"></div></section>`;
}

    ${sw("build_order.arrows", bo.arrows !== false, N_("Arrows to move the build a step"), N_("above the panel: back or forward when the villager count gets the step wrong"), "bo-arrows")}
    ${num("build_order.previous_s", bo.previous_s ?? 10, N_("Show the previous step for"), N_("seconds after a step is reached; 0 keeps it on screen"))}
    ${num("build_order.next_after_s", bo.next_after_s ?? 10, N_("Show the next step after"), N_("seconds on a step; 0 shows it at once"))}
    ${num("build_order.end_after_s", bo.end_after_s ?? 30, N_("Hide the build after the last step"), N_("seconds; then the panel and the build's alerts leave the screen"))}
    ${sw("build_order.empty_places", bo.empty_places === true, N_("Show places without villagers"), N_("the resource icon and a dash where the step puts no villagers"), "bo-empty")}
    ${sw("build_order.tips", bo.tips !== false, N_("Build tips"), N_("the author's advice in a card under the current step"), "bo-tips")}
    ${sw("build_order.auto_update", bo.auto_update !== false, N_("Update builds when Reeve starts"), N_("checks aoe4guides.com for changes their author made"))}
    ${sw("build.enabled", b.enabled !== false, N_("Off-build alerts"), N_("when your villagers are not where the step puts them"))}
    ${num("build.warn_after_s", b.warn_after_s ?? 6, N_("Warn after"), N_("seconds off the step; until then it is info"))}
    ${num("build.critical_after_s", b.critical_after_s ?? 12, N_("Critical after"), N_("seconds off the step"))}
    ${num("build.persist_s", b.persist_s ?? 0, N_("Show after"), N_("seconds"))}</div></section>`;
}

}

function bindAppearance() {
  const a = () => cfg.appearance || { theme: "age", corners: "rounded" };
  document.querySelectorAll("[data-theme]").forEach(b => b.addEventListener("click", () => setLook(b.dataset.theme, a().corners)));
  document.querySelectorAll("[data-corners]").forEach(b => b.addEventListener("click", () => setLook(a().theme, b.dataset.corners)));
  $("#show-rec").addEventListener("change", e => {
    cfg.overlay = { ...(cfg.overlay || {}), show_in_recordings: e.target.checked };
    api().set_setting("overlay", "show_in_recordings", e.target.checked);
  });
  document.querySelectorAll("[data-anim]").forEach(s => s.addEventListener("change", () => {
    const animation = { ...ANIM_DEFAULT, ...((cfg.overlay || {}).animation || {}), [s.dataset.anim]: s.value };
    cfg.overlay = { ...(cfg.overlay || {}), animation };
    api().set_setting("overlay", "animation", animation);
    playPreview(s.dataset.anim);
  }));
}

async function setLook(theme, corners) {
  cfg.appearance = { ...(cfg.appearance || {}), theme, corners };
  applyLook(await api().set_appearance(theme, corners));
  $("#appearance").outerHTML = appearance();
  bindAppearance();
  $("#bpreview").classList.toggle("rounded", corners === "rounded");
  $(`[data-theme="${theme}"]`).focus();
}

async function showSettings() {
  const [s, storage, preview] = await Promise.all([api().settings(), api().storage(), api().build_preview()]);
  buildPreview = preview;
  cfg = s.values;
  themeList = s.themes;
  let h = `<h2>${tr("Settings")}</h2><p class="lede">${tr("Changes apply to the running overlay within a few seconds. Only what differs from the defaults is saved.")}</p>`;
  h += languageSection();
  h += appearance();
  h += buildsSection();
  const group = g => {
    const v = cfg[g.key];
    let h = `<section class="group"><header><h3>${tr(g.title)}</h3><input type="checkbox" class="switch" data-path="${g.key}.enabled" ${v.enabled ? "checked" : ""} aria-label="${tr("{name} on or off", { name: tr(g.title) })}"></header>`;
    g.fields.forEach(([k, label, unit, kind]) => {
      h += `<div class="row"><label>${tr(label)}<small>${tr(unit)}</small></label>${input(`${g.key}.${k}`, v[k], kind)}</div>`;
    });
    if (g.usage) {
      h += `<p class="usage">${trn("{n} match uses {mb} MB. Applied when the app starts.", "{n} matches use {mb} MB. Applied when the app starts.", storage.matches, { mb: storage.mb })}</p>`;
    }
    if (g.bands) {
      h += `<div class="row limits"><label>${tr("Limit per age")}<small>${tr("a later age's limit escalates; empty is no limit")}</small></label><div class="bands">`;
      ["I", "II", "III", "IV"].forEach((age, i) => {
        const lim = v.age_limits[i];
        h += `<span class="age-limit"><i>${age}</i><input type="number" min="0" step="50" data-age-limit="${i}" value="${lim ?? ""}" placeholder="${tr("none")}" aria-label="${tr("Age {age} limit", { age })}"></span>`;
      });
      h += `</div></div>`;
    }
    return h + `</section>`;
  };
  GROUPS.filter(g => !g.usage).forEach(g => { h += group(g); });
  const snd = cfg.sound, options = name => s.sounds.map(n => `<option ${n === name ? "selected" : ""}>${n}</option>`).join("");
  h += `<section class="group"><header><h3>${tr("Sounds")}</h3><input type="checkbox" class="switch" data-path="sound.enabled" ${snd.enabled ? "checked" : ""} aria-label="${tr("Sounds on or off")}"></header>
    <div class="row"><label>${tr("Volume")}</label><div class="pair"><input type="range" min="0" max="1" step="0.05" data-path="sound.volume" data-kind="float" value="${snd.volume ?? 0.5}" aria-label="${tr("Volume")}"><output id="vol">${Math.round((snd.volume ?? 0.5) * 100)}%</output></div></div>`;
  SEV.forEach(([sev, label]) => {
    h += `<div class="row"><label>${tr(label)}<small><input type="checkbox" data-repeat="${sev}" ${(snd.repeat || []).includes(sev) ? "checked" : ""}> ${tr("repeat while unresolved")}</small></label>
      <div class="pair"><select data-path="sound.${sev}"><option value="">${tr("none")}</option>${options(snd[sev])}</select><button type="button" data-preview="${sev}" title="${tr("Play")}">▶</button></div></div>`;
  });
  h += `<div class="row"><label>${tr("Repeat every")}<small>${tr("seconds")}</small></label>${input("sound.repeat_s", snd.repeat_s, "int")}</div>
    <div class="row wide"><label>${tr("Your sounds")}<small>${tr("any audio or video file; cut to 1.5 s and leveled like the built-in sounds")}</small></label>
      <div class="mine"><div id="mine"></div><button type="button" id="add-sound">${tr("Add sound…")}</button>
      <input type="file" id="sound-file" accept="audio/*,video/*" hidden></div></div>
    <p class="usage" id="sound-status" role="status"></p></section>`;
  GROUPS.filter(g => g.usage).forEach(g => { h += group(g); });
  h += updatesSection(updateInfo || { current: (await api().version()) });
  h += `<div class="actions"><button class="primary" id="save">${tr("Save changes")}</button><button id="reset">${tr("Restore defaults")}</button><span class="status" id="status"></span></div>`;
  $("#main").innerHTML = h;
  document.querySelectorAll("[data-preview]").forEach(b => b.addEventListener("click", () => {
    const name = document.querySelector(`[data-path="sound.${b.dataset.preview}"]`).value;
    if (name) api().preview_sound(name, volume());
  }));
  $('[data-path="sound.volume"]').addEventListener("input", e => { $("#vol").textContent = `${Math.round(e.target.value * 100)}%`; });
  renderMine(s.user_sounds);
  bindLanguage();
  bindAppearance();
  bindBuildsSection();
  bindUpdateActions();
  $("#add-sound").addEventListener("click", () => $("#sound-file").click());
  $("#sound-file").addEventListener("change", e => addSound(e.target.files[0]));
  $("#save").addEventListener("click", save);
  $("#reset").addEventListener("click", async () => { await api().reset_settings(); await showSettings(); $("#status").textContent = tr("Defaults restored."); });
}

// Your sounds: the page decodes the file (Web Audio reads mp3, ogg, wav, flac
// and the audio of mp4/webm), keeps the part from the first sound on, at most
// 1.5 s, and Python levels it and saves it as WAV. No ffmpeg needed.
const RATE = 44100, MAX_S = 1.5;
const volume = () => Number($('[data-path="sound.volume"]').value);

async function clipSamples(file) {
  const ctx = new AudioContext();
  let decoded;
  try { decoded = await ctx.decodeAudioData(await file.arrayBuffer()); }
  catch { throw new Error(tr("no audio the hub can read in this file")); }
  finally { ctx.close(); }
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(decoded.duration * RATE)), RATE);
  const src = off.createBufferSource();
  src.buffer = decoded; src.connect(off.destination); src.start();
  const x = (await off.startRendering()).getChannelData(0);
  let peak = 0;
  for (let i = 0; i < x.length; i++) peak = Math.max(peak, Math.abs(x[i]));
  if (!peak) throw new Error(tr("the file is silent"));
  let start = 0;
  while (Math.abs(x[start]) <= 0.02 * peak) start++;
  start = Math.max(0, start - Math.round(0.002 * RATE));
  const clip = x.slice(start, start + Math.round(MAX_S * RATE));
  const bytes = new Uint8Array(clip.buffer);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function renderMine(list) {
  $("#mine").innerHTML = list.length ? list.map(n => `<span class="chip">${n}
    <button type="button" data-play="${n}" title="${tr("Play {name}", { name: n })}" aria-label="${tr("Play {name}", { name: n })}">▶</button>
    <button type="button" data-remove="${n}" title="${tr("Remove {name}", { name: n })}" aria-label="${tr("Remove {name}", { name: n })}">✕</button></span>`).join("")
    : `<span class="none">${tr("None yet")}</span>`;
  document.querySelectorAll("[data-play]").forEach(b => b.addEventListener("click", () => api().preview_sound(b.dataset.play, volume())));
  document.querySelectorAll("[data-remove]").forEach(b => b.addEventListener("click", () => removeSound(b.dataset.remove)));
}

function soundOptions(add, remove) {
  document.querySelectorAll('select[data-path^="sound."]').forEach(sel => {
    if (add && ![...sel.options].some(o => o.value === add)) {
      const names = [...sel.options].map(o => o.value).filter(Boolean).concat(add).sort();
      const o = new Option(add, add);
      sel.add(o, sel.options[names.indexOf(add) + 1] || null);
    }
    if (remove) [...sel.options].filter(o => o.value === remove).forEach(o => o.remove());
  });
}

async function addSound(file) {
  if (!file) return;
  const st = $("#sound-status");
  st.textContent = tr("Reading {name}…", { name: file.name });
  try {
    const r = await api().add_sound(file.name, await clipSamples(file));
    if (r.error) throw new Error(r.error);
    soundOptions(r.name, null);
    renderMine(r.user_sounds);
    st.textContent = tr("Added “{name}” ({seconds} s). Choose it for a severity above, then save.", { name: r.name, seconds: r.seconds });
    api().preview_sound(r.name, volume());
  } catch (e) {
    st.textContent = tr("Could not add {name}: {error}.", { name: file.name, error: e.message });
  }
  $("#sound-file").value = "";
}

async function removeSound(name) {
  const r = await api().remove_sound(name);
  if (r.error) { $("#sound-status").textContent = r.error; return; }
  soundOptions(null, name);
  for (const [sev] of SEV) {
    const sel = document.querySelector(`[data-path="sound.${sev}"]`);
    if (sel.value !== r.sound[sev]) sel.value = r.sound[sev] || "";
  }
  cfg.sound = { ...cfg.sound, ...r.sound };
  renderMine(r.user_sounds);
  $("#sound-status").textContent = tr("Removed “{name}”. Severities that used it are back to their default sound.", { name });
}

// Updates: the daily check runs in the app; the hub shows its result and can ask now.
let updateInfo = null;

function showBanner(u) {
  const b = $("#update-banner");
  updateInfo = u;
  renderUpdateActions(u);
  if (!u || !u.newer) { $("#update-wrap").hidden = true; return; }
  b.innerHTML = `<b>${tr("Reeve {version} is available", { version: u.latest })}</b><span>${tr("You have {version}.", { version: u.current })}</span><span class="grow"></span>
    <button type="button" id="upd-notes">${tr("What's new")}</button>
    ${u.can_install ? `<button type="button" class="primary" id="upd-now">${tr("Update now")}</button>`
                    : `<button type="button" class="primary" id="upd-get">${tr("Download")}</button>`}`;
  $("#update-wrap").hidden = false;
  $("#upd-notes").addEventListener("click", () => api().open_url(u.page));
  if (u.can_install) $("#upd-now").addEventListener("click", updateNow);
  else $("#upd-get").addEventListener("click", () => api().open_url(u.page));
}

async function updateNow() {
  const b = $("#update-banner");
  $("#update-wrap").hidden = false;
  document.querySelectorAll("#upd-now, #upd-now-2").forEach(x => { x.disabled = true; });
  b.innerHTML = `<b>${tr("Downloading Reeve {version}…", { version: updateInfo.latest })}</b><span>${tr("Reeve closes and reopens by itself when the update is installed.")}</span>`;
  const r = await api().update_now();
  if (r.error) b.innerHTML = `<b>${tr("The update did not start")}</b><span>${tr("{error}. Try again later, or download it from the release page.", { error: r.error })}</span>`;
}

function updatesSection(u) {
  const line = !u.latest ? tr("Not checked yet.")
    : u.newer ? tr("Reeve {version} is available.", { version: u.latest }) : tr("You have the latest version ({version}).", { version: u.current });
  return `<section class="group"><header><h3>${tr("Hub")}</h3></header>
    <div class="row"><label>${tr("Close when a match starts")}<small>${tr("frees its memory for the game; open it again from the tray")}</small></label>
      <input type="checkbox" class="switch" data-path="hub.close_on_match" ${cfg.hub?.close_on_match !== false ? "checked" : ""} aria-label="${tr("Close the hub when a match starts")}"></div></section>
    <section class="group"><header><h3>${tr("Updates")}</h3></header>
    <div class="row"><label>${tr("Check for updates")}<small>${tr("once a day, on GitHub")}</small></label>
      <input type="checkbox" class="switch" data-path="updates.check" ${cfg.updates?.check !== false ? "checked" : ""} aria-label="${tr("Check for updates")}"></div>
    <div class="row version"><label>${tr("Version {version}", { version: u.current })}<small id="upd-line">${line}</small></label>
      <div class="upd" id="upd-actions">${updateActions(u)}</div></div></section>`;
}

// Next to "Check now": the same actions as the banner when a newer version exists.
function updateActions(u) {
  if (!u || !u.newer) return `<button type="button" id="upd-check">${tr("Check now")}</button>`;
  return `<button type="button" id="upd-check">${tr("Check now")}</button><button type="button" id="upd-notes-2">${tr("What's new")}</button>
    ${u.can_install ? `<button type="button" class="primary" id="upd-now-2">${tr("Update now")}</button>`
                    : `<button type="button" class="primary" id="upd-get-2">${tr("Download")}</button>`}`;
}

function renderUpdateActions(u) {
  const box = $("#upd-actions");
  if (!box) return;
  box.innerHTML = updateActions(u);
  bindUpdateActions();
}

function bindUpdateActions() {
  $("#upd-check").addEventListener("click", async () => {
    $("#upd-line").textContent = tr("Checking…");
    const u = await api().update_status(true);
    $("#upd-line").textContent = !u.latest ? tr("GitHub could not be reached. Try again later.")
      : u.newer ? tr("Reeve {version} is available.", { version: u.latest }) : tr("You have the latest version ({version}).", { version: u.current });
    showBanner(u);
  });
  const u = updateInfo;
  $("#upd-notes-2")?.addEventListener("click", () => api().open_url(u.page));
  $("#upd-now-2")?.addEventListener("click", updateNow);
  $("#upd-get-2")?.addEventListener("click", () => api().open_url(u.page));
}

function collect() {
  const out = JSON.parse(JSON.stringify(cfg));
  document.querySelectorAll("[data-path]").forEach(el => {
    const [a, b] = el.dataset.path.split(".");
    let v;
    if (el.type === "checkbox") v = el.checked;
    else if (el.dataset.kind === "pct") v = Number(el.value) / 100;
    else if (el.dataset.kind === "int") v = parseInt(el.value, 10);
    else if (el.dataset.kind === "float") v = Number(el.value);
    else v = el.value;
    out[a][b] = v;
  });
  document.querySelectorAll("[data-age-limit]").forEach(el => {
    out.floating.age_limits[Number(el.dataset.ageLimit)] = el.value === "" ? null : Number(el.value);
  });
  out.sound.repeat = [...document.querySelectorAll("[data-repeat]")].filter(c => c.checked).map(c => c.dataset.repeat);
  return out;
}

async function save() {
  const changed = await api().save_settings(collect());
  const n = Object.keys(changed).length;
  $("#status").textContent = n ? tr("Saved. The overlay picks it up within a few seconds.") : tr("Saved. Everything is at its default.");
}

window.addEventListener("pywebviewready", async () => {
  applyLook(await api().theme_css());
  useLanguage(await api().language());
  api().update_status(false).then(showBanner);
  version = await api().version();
  applyStatic();
  $("#nav-matches").addEventListener("click", () => navTo("matches"));
  $("#nav-builds").addEventListener("click", () => navTo("builds"));
  $("#nav-settings").addEventListener("click", () => navTo("settings"));
  $("#data-folder").addEventListener("click", () => api().open_data_folder());
  showMatches();
});
</script>
