name: release

# The squash merge of the release PR into main builds the installer and
# publishes the GitHub release v<version> (scripts/build.py --release).
# A push to main whose version is already tagged publishes nothing.
# Run by hand with dry_run to build a test installer without publishing.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build a test installer (0.0.0.1-test) as an artifact, publish nothing"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DRY_RUN: ${{ inputs.dry_run == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = uv run python -c "from reeve import __version__; print(__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:DRY_RUN -eq 'true') {
            "build=true" >> $env:GITHUB_OUTPUT
          } elseif (git tag -l "v$v") {
            "::notice::v$v is already released: nothing to publish"
            "build=false" >> $env:GITHUB_OUTPUT
          } elseif (-not (Test-Path "docs/releases/v$v.md")) {
            "::error::missing release notes: docs/releases/v$v.md"
            exit 1
          } else {
            "build=true" >> $env:GITHUB_OUTPUT
          }

      - name: Tests
        if: steps.version.outputs.build == 'true'
        run: uv run pytest -q

      - name: Inno Setup
        if: steps.version.outputs.build == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build and publish
        if: steps.version.outputs.build == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/build.py --release

      - name: Test build
        if: env.DRY_RUN == 'true'
        run: uv run python scripts/build.py --as-version 0.0.0.1

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.build == 'true' && !cancelled()
        with:
          name: installer
          path: dist/Reeve-*-setup.exe
          if-no-files-found: ignore
